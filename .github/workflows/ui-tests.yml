name: UI tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: XCTest UI
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Setup Fastlane
        uses: ./.github/actions/setup-fastlane
        with:
          xcode-version: "26.3"

      - name: Run UI tests
        run: bundle exec fastlane ios ui_tests

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: fastlane/test_output/ui_tests/
          retention-days: 14
